schema_version: 1

context:
  version: 1.3.1

package:
  name: pytoolconfig
  version: ${{ version }}

source:
- url: https://files.pythonhosted.org/packages/source/p/pytoolconfig/pytoolconfig-${{ version }}.tar.gz
  sha256: 51e6bd1a6f108238ae6aab6a65e5eed5e75d456be1c2bf29b04e5c1e7d7adbae

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - pip
    - pdm-backend >=1.0.5
    - python ${{ python_min }}.*
  run:
    - packaging >=23.2
    - python >=${{ python_min }}
    - tomli >=2.0.1

tests:
  - python:
      imports:
        - pytoolconfig
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"

about:
  summary: Python tool configuration
  license: LGPL-3.0-or-later
  license_file: LICENSE
  homepage: https://pypi.org/project/pytoolconfig

extra:
  recipe-maintainers:
    - jan-janssen
